# Base locale seule :   docker compose -f deploy/docker-compose.yml up -d db
# Base, API et sauvegardes : docker compose -f deploy/docker-compose.yml up -d --build
# Les variables viennent de deploy/.env (copie de deploy/.env.example).
name: gestionstock

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestionstock}
      POSTGRES_USER: ${POSTGRES_USER:-gestionstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans deploy/.env}
    ports:
      # Liée à 127.0.0.1 : la base n'est pas exposée sur le réseau de la boutique.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__GestionStock: "Host=db;Port=5432;Database=${POSTGRES_DB:-gestionstock};Username=${POSTGRES_USER:-gestionstock};Password=${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans deploy/.env}"
      BaseDeDonnees__AppliquerMigrationsAuDemarrage: "true"
      Stockage__RepertoireRacine: /donnees/fichiers
      Entreprise__AssujettiTva: ${ENTREPRISE_ASSUJETTIE_TVA:-false}
      Entreprise__Nom: ${ENTREPRISE_NOM:-GestionStock}
      Entreprise__Adresse: ${ENTREPRISE_ADRESSE:-}
      Entreprise__Telephone: ${ENTREPRISE_TELEPHONE:-}
      Entreprise__NumeroContribuable: ${ENTREPRISE_NIU:-}
      Entreprise__Logo: ${ENTREPRISE_LOGO:-}
      Caisse__Postes__0: ${CAISSE_POSTE:-CAISSE-1}
      Identite__AdministrateurInitial__Identifiant: ${ADMIN_IDENTIFIANT:-admin}
      Identite__AdministrateurInitial__MotDePasse: ${ADMIN_MOT_DE_PASSE:?Définir ADMIN_MOT_DE_PASSE dans deploy/.env}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - donnees-fichiers:/donnees/fichiers

  # Sauvegardes (décision 32) : locale chaque heure sur le disque externe, copie chiffrée quotidienne hors de la boutique.
  # Tourne même si l'API est arrêtée. Voir docs/exploitation.md (disque externe, rclone, clés age, restauration).
  sauvegarde:
    build:
      context: sauvegarde
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gestionstock}
      PGUSER: ${POSTGRES_USER:-gestionstock}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans deploy/.env}
      SAUVEGARDE_MINUTE: ${SAUVEGARDE_MINUTE:-5}
      SAUVEGARDE_DISTANT: ${SAUVEGARDE_DISTANT:-}
      SAUVEGARDE_CLE_PUBLIQUE: ${SAUVEGARDE_CLE_PUBLIQUE:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      # Disque externe de la boutique (chemin de l'hôte) ; par défaut deploy/sauvegardes, à remplacer en boutique.
      - ${SAUVEGARDE_REPERTOIRE:-./sauvegardes}:/sauvegardes
      - donnees-fichiers:/donnees/fichiers
      # Configuration de rclone (contient les accès au stockage en ligne : jamais versionnée).
      - ${SAUVEGARDE_RCLONE:-./rclone}:/config/rclone

volumes:
  donnees-postgres:
  donnees-fichiers:
