# Intégration continue : build, tests (y compris PostgreSQL réelle via Testcontainers),
# puis image de l'API et docker-compose démarrés comme en boutique.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restauration
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # CI=true (défini par GitHub Actions) : sans Docker, les tests d'intégration échouent au lieu d'être ignorés.
      - name: Tests
        run: dotnet test --no-build --configuration Release

  deploiement:
    name: Image et docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml
    steps:
      - uses: actions/checkout@v5

      - name: Variables de déploiement (valeurs de développement)
        run: cp deploy/.env.example deploy/.env

      - name: Construction et démarrage
        run: $COMPOSE up -d --build --wait

      - name: L'API répond et la base est prête
        run: |
          for essai in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/pret; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'est pas prête après 60 secondes."
          exit 1

      - name: La migration Initial de chaque module est appliquée
        run: |
          for schema in identite referentiel prix stock achats credit caisse inventaire; do
            $COMPOSE exec -T db psql -U gestionstock -d gestionstock -tAc \
              "SELECT migration_id FROM $schema.__ef_migrations_history" | tee migrations.txt
            grep -q "_Initial$" migrations.txt
          done

      - name: Les vues de lecture des rapports existent (16)
        run: |
          for vue in identite.v_utilisateurs referentiel.v_articles caisse.v_tickets caisse.v_lignes_vendues caisse.v_paiements \
                     caisse.v_remboursements_credit caisse.v_sessions credit.v_clients credit.v_operations \
                     credit.v_ventes_credit stock.v_mouvements stock.v_soldes achats.v_receptions achats.v_frais \
                     achats.v_paiements_fournisseurs caisse.v_anomalies; do
            $COMPOSE exec -T db psql -U gestionstock -d gestionstock -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM $vue" > /dev/null
          done
          # Sans la permission Rapports.Consulter, les rapports sont refusés.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/rapports/stock)" = "401"

      - name: Sans jeton, une route métier est refusée (401)
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/identite/moi)" = "401"

      - name: L'administrateur initial se connecte
        run: |
          source deploy/.env
          jeton=$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"identifiant\":\"$ADMIN_IDENTIFIANT\",\"motDePasse\":\"$ADMIN_MOT_DE_PASSE\"}" \
            http://localhost:8080/api/identite/connexion | jq -r .accessToken)
          curl -fsS -H "Authorization: Bearer $jeton" http://localhost:8080/api/identite/moi | tee moi.json
          jq -e '.roles == ["Administrateur"]' moi.json

      - name: Cycle de vie d'un compte du personnel
        run: |
          source deploy/.env
          bash .github/scripts/verifier-comptes.sh http://localhost:8080 "$ADMIN_IDENTIFIANT" "$ADMIN_MOT_DE_PASSE"

      - name: La caisse répond (postes configurés)
        run: |
          source deploy/.env
          jeton=$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"identifiant\":\"$ADMIN_IDENTIFIANT\",\"motDePasse\":\"$ADMIN_MOT_DE_PASSE\"}" \
            http://localhost:8080/api/identite/connexion | jq -r .accessToken)
          # L'Administrateur ne vend pas (8.3) : la caisse lui est refusée.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $jeton" http://localhost:8080/api/caisse/postes)" = "403"
          curl -fsS -H "Authorization: Bearer $jeton" http://localhost:8080/api/prix/regime | jq -e '.assujetti == false'

      - name: Identité publique de la boutique et interface de la tranche 6
        run: |
          source deploy/.env
          # Seuls le nom et la présence d'un logo sont publics (écran de connexion) ; l'en-tête des reçus ne l'est pas.
          curl -fsS http://localhost:8080/api/caisse/boutique | jq -e --arg nom "$ENTREPRISE_NOM" '.nom == $nom and .logo == false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/caisse/boutique/logo)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/caisse/entete)" = "401"
          # Feuille de style à jetons (cibles tactiles) et raccourcis clavier de la caisse servis par l'image.
          curl -fsS http://localhost:8080/css/app.css | grep -- '--cible:' > /dev/null
          curl -fsS http://localhost:8080/js/outils.js | grep 'raccourcis' > /dev/null

      - name: Caisse hors ligne (tranche 7)
        run: |
          # Application installable : manifeste, service worker publié et liste des fichiers à garder sur le poste.
          curl -fsS http://localhost:8080/manifest.webmanifest | jq -e '.display == "standalone"'
          curl -fsS http://localhost:8080/service-worker.js | grep 'service-worker-assets.js' > /dev/null
          curl -fsS http://localhost:8080/service-worker-assets.js | grep '"assets"' > /dev/null
          # Données gardées sur le poste et anomalies : jamais sans connexion.
          for route in referentiel/catalogue-caisse prix/grille caisse/anomalies caisse/postes/occupation; do
            test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/$route)" = "401"
          done

      - name: Le client Blazor est servi
        run: |
          curl -fsS http://localhost:8080/ | grep -q '_framework/blazor.webassembly.js'
          curl -fsS http://localhost:8080/receptions/nouvelle | grep -q '<div id="app">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/_framework/blazor.webassembly.js)" = "200"

      - name: Journaux des conteneurs
        if: always()
        run: $COMPOSE logs

      - name: Arrêt
        if: always()
        run: $COMPOSE down -v
