# Intégration continue : build, tests (y compris PostgreSQL réelle via Testcontainers),
# puis image de l'API et docker-compose démarrés comme en boutique, et parcours de bout en bout dans Chromium.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restauration
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # CI=true (défini par GitHub Actions) : sans Docker, les tests d'intégration échouent au lieu d'être ignorés.
      - name: Tests
        run: dotnet test --no-build --configuration Release

  deploiement:
    name: Image et docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml
    steps:
      - uses: actions/checkout@v5

      - name: Variables de déploiement (valeurs de développement)
        run: cp deploy/.env.example deploy/.env

      # Copie hors site vers un distant rclone de type « local » (un dossier du disque de sauvegarde), chiffrée pour
      # une clé age jetable dont la clé privée reste sur le runner, comme chez le propriétaire.
      - name: Distant rclone et clé age d'essai
        run: |
          mkdir -p deploy/rclone
          printf '[essai]\ntype = local\n' > deploy/rclone/rclone.conf
          $COMPOSE build sauvegarde
          docker run --rm --entrypoint age-keygen gestionstock-sauvegarde > "$RUNNER_TEMP/cle-age.txt" 2>/dev/null
          publique=$(sed -n 's/^# public key: //p' "$RUNNER_TEMP/cle-age.txt")
          test -n "$publique"
          sed -i -e 's|^SAUVEGARDE_DISTANT=.*|SAUVEGARDE_DISTANT=essai:/sauvegardes/hors-site|' \
                 -e "s|^SAUVEGARDE_CLE_PUBLIQUE=.*|SAUVEGARDE_CLE_PUBLIQUE=$publique|" deploy/.env

      - name: Construction et démarrage
        run: $COMPOSE up -d --build --wait

      - name: L'API répond et la base est prête
        run: |
          for essai in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/pret; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'est pas prête après 60 secondes."
          exit 1

      - name: La migration Initial de chaque module est appliquée
        run: |
          for schema in identite referentiel prix stock achats credit caisse inventaire exploitation; do
            $COMPOSE exec -T db psql -U gestionstock -d gestionstock -tAc \
              "SELECT migration_id FROM $schema.__ef_migrations_history" | tee migrations.txt
            grep -q "_Initial$" migrations.txt
          done

      - name: Les vues de lecture publiées existent (18)
        run: |
          for vue in identite.v_utilisateurs referentiel.v_articles caisse.v_tickets caisse.v_lignes_vendues caisse.v_paiements \
                     caisse.v_remboursements_credit caisse.v_sessions credit.v_clients credit.v_operations \
                     credit.v_ventes_credit stock.v_mouvements stock.v_soldes achats.v_receptions achats.v_frais \
                     achats.v_paiements_fournisseurs caisse.v_anomalies exploitation.v_ecarts exploitation.v_sauvegardes; do
            $COMPOSE exec -T db psql -U gestionstock -d gestionstock -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM $vue" > /dev/null
          done
          # Sans la permission Rapports.Consulter, les rapports sont refusés.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/rapports/stock)" = "401"

      - name: Le planificateur (Hangfire) a créé ses tables et s'est déclaré
        run: |
          for essai in $(seq 1 15); do
            serveurs=$($COMPOSE exec -T db psql -U gestionstock -d gestionstock -tAc "SELECT count(*) FROM hangfire.server" 2>/dev/null || echo 0)
            if [ "${serveurs:-0}" -ge 1 ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Aucun serveur Hangfire déclaré."
          exit 1

      - name: Sans jeton, une route métier est refusée (401)
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/identite/moi)" = "401"

      - name: L'administrateur initial se connecte
        run: |
          source deploy/.env
          jeton=$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"identifiant\":\"$ADMIN_IDENTIFIANT\",\"motDePasse\":\"$ADMIN_MOT_DE_PASSE\"}" \
            http://localhost:8080/api/identite/connexion | jq -r .accessToken)
          curl -fsS -H "Authorization: Bearer $jeton" http://localhost:8080/api/identite/moi | tee moi.json
          jq -e '.roles == ["Administrateur"]' moi.json

      - name: Cycle de vie d'un compte du personnel
        run: |
          source deploy/.env
          bash .github/scripts/verifier-comptes.sh http://localhost:8080 "$ADMIN_IDENTIFIANT" "$ADMIN_MOT_DE_PASSE"

      - name: La caisse répond (postes configurés)
        run: |
          source deploy/.env
          jeton=$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"identifiant\":\"$ADMIN_IDENTIFIANT\",\"motDePasse\":\"$ADMIN_MOT_DE_PASSE\"}" \
            http://localhost:8080/api/identite/connexion | jq -r .accessToken)
          # L'Administrateur ne vend pas (8.3) : la caisse lui est refusée.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $jeton" http://localhost:8080/api/caisse/postes)" = "403"
          curl -fsS -H "Authorization: Bearer $jeton" http://localhost:8080/api/prix/regime | jq -e '.assujetti == false'

      - name: Identité publique de la boutique et interface de la tranche 6
        run: |
          source deploy/.env
          # Seuls le nom et la présence d'un logo sont publics (écran de connexion) ; l'en-tête des reçus ne l'est pas.
          curl -fsS http://localhost:8080/api/caisse/boutique | jq -e --arg nom "$ENTREPRISE_NOM" '.nom == $nom and .logo == false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/caisse/boutique/logo)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/caisse/entete)" = "401"
          # Feuille de style à jetons (cibles tactiles) et raccourcis clavier de la caisse servis par l'image.
          curl -fsS http://localhost:8080/css/app.css | grep -- '--cible:' > /dev/null
          curl -fsS http://localhost:8080/js/outils.js | grep 'raccourcis' > /dev/null

      - name: Caisse hors ligne (tranche 7)
        run: |
          # Application installable : manifeste, service worker publié et liste des fichiers à garder sur le poste.
          curl -fsS http://localhost:8080/manifest.webmanifest | jq -e '.display == "standalone"'
          curl -fsS http://localhost:8080/service-worker.js | grep 'service-worker-assets.js' > /dev/null
          curl -fsS http://localhost:8080/service-worker-assets.js | grep '"assets"' > /dev/null
          # Données gardées sur le poste et anomalies : jamais sans connexion.
          for route in referentiel/catalogue-caisse prix/grille caisse/anomalies caisse/postes/occupation; do
            test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/$route)" = "401"
          done

      # Tests de bout en bout (tranche 9) : un vrai Chromium joue les parcours de chaque rôle sur l'application
      # déployée. La trace Playwright d'un parcours en échec est gardée en artefact (playwright show-trace).
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Tests de bout en bout (navigateur)
        env:
          E2E_URL: http://localhost:8080
          E2E_TRACES: ${{ runner.temp }}/traces
        run: |
          source deploy/.env
          dotnet build tests/GestionStock.E2E --configuration Release
          pwsh tests/GestionStock.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          mkdir -p "$E2E_TRACES"
          E2E_ADMIN="$ADMIN_IDENTIFIANT" E2E_MOT_DE_PASSE="$ADMIN_MOT_DE_PASSE" \
            dotnet tests/GestionStock.E2E/bin/Release/net10.0/GestionStock.E2E.dll

      - name: Traces des parcours en échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-e2e
          path: ${{ runner.temp }}/traces
          if-no-files-found: ignore

      # Redémarrage de PostgreSQL (coupure de courant, mise à jour) : les connexions du pool sont mortes. La première
      # requête reçoit un 503 traduit (ou 200 si une connexion neuve est prise), jamais une erreur 500 ; la suivante passe.
      - name: Coupure de la base, 503 puis reprise
        run: |
          source deploy/.env
          jeton=$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"identifiant\":\"$ADMIN_IDENTIFIANT\",\"motDePasse\":\"$ADMIN_MOT_DE_PASSE\"}" \
            http://localhost:8080/api/identite/connexion | jq -r .accessToken)
          route=http://localhost:8080/api/referentiel/articles
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $jeton" $route)" = "200"
          $COMPOSE restart db
          until $COMPOSE exec -T db pg_isready -U gestionstock -d gestionstock > /dev/null; do sleep 1; done
          premier=$(curl -s -o premier.json -w '%{http_code}' -H "Authorization: Bearer $jeton" $route)
          echo "Première requête après le redémarrage : $premier"
          if [ "$premier" = "503" ]; then jq -e '.code == "Base.Indisponible"' premier.json; else test "$premier" = "200"; fi
          sleep 1
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $jeton" $route)" = "200"

      - name: Sauvegarde, copie chiffrée hors site et restauration (tranche 8)
        run: |
          source deploy/.env
          bash .github/scripts/verifier-sauvegarde.sh http://localhost:8080 "$ADMIN_IDENTIFIANT" "$ADMIN_MOT_DE_PASSE" \
            "$RUNNER_TEMP/cle-age.txt" essai:/sauvegardes/hors-site

      # Étape 67 : les postes du réseau passent par le proxy HTTPS (autorité locale) ; l'API n'écoute que sur la machine.
      - name: HTTPS en boutique (proxy, autorité locale)
        run: |
          for essai in $(seq 1 15); do
            curl -fsS -o racine.crt http://localhost/certificat-racine.crt && break
            sleep 2
          done
          openssl x509 -in racine.crt -noout -subject | grep -q 'GestionStock'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/caisse)" = "308"
          curl -fsS --cacert racine.crt https://localhost/health/pret
          curl -fsS --cacert racine.crt https://127.0.0.1/service-worker.js | grep -q 'service-worker-assets.js'
          # Sans nom annoncé (adresse IP), le certificat de l'adresse du serveur est présenté.
          echo | openssl s_client -connect 127.0.0.1:443 2>/dev/null | openssl x509 -noout -ext subjectAltName | grep -q 'IP Address:127.0.0.1'
          $COMPOSE port api 8080 | grep -q '^127.0.0.1:'
          # La clé de l'autorité est dans le volume des fichiers, donc dans les sauvegardes.
          $COMPOSE exec -T sauvegarde test -f /donnees/fichiers/proxy/caddy/pki/authorities/local/root.key

      - name: Le client Blazor est servi
        run: |
          curl -fsS http://localhost:8080/ | grep -q '_framework/blazor.webassembly.js'
          curl -fsS http://localhost:8080/receptions/nouvelle | grep -q '<div id="app">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/_framework/blazor.webassembly.js)" = "200"

      - name: Journaux des conteneurs
        if: always()
        run: $COMPOSE logs

      - name: Arrêt
        if: always()
        run: |
          $COMPOSE down -v
          rm -f "$RUNNER_TEMP/cle-age.txt"
