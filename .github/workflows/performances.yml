# Mesures de performance sur le jeu volumineux (tranche 9) : lancées à la demande, pas à chaque push.
# Échelle 1 = grosse boutique sur 3 ans (20 000 articles, 2 000 tickets par jour, ≈ 6,5 millions de mouvements de stock).
# Le tableau des mesures est publié dans le résumé de l'exécution et gardé en artefact.
name: Performances

on:
  workflow_dispatch:
    inputs:
      echelle:
        description: "Échelle du jeu (1 = grosse boutique sur 3 ans)"
        required: true
        default: "1"
      repetitions:
        description: "Mesures par route"
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  mesures:
    name: Jeu volumineux et mesures
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml
    steps:
      - uses: actions/checkout@v5

      - name: Démarrage comme en boutique
        run: |
          cp deploy/.env.example deploy/.env
          $COMPOSE up -d --build --wait db api
          for essai in $(seq 1 30); do curl -fsS http://localhost:8080/health/pret && exit 0; sleep 2; done
          exit 1

      - name: Génération du jeu volumineux
        run: |
          time $COMPOSE exec -T db psql -U gestionstock -d gestionstock -v echelle=${{ inputs.echelle }} < deploy/volume/generer.sql
          $COMPOSE exec -T db psql -U gestionstock -d gestionstock -c \
            "SELECT pg_size_pretty(pg_database_size('gestionstock')) AS taille,
                    (SELECT count(*) FROM stock.mouvement_stock) AS mouvements,
                    (SELECT count(*) FROM caisse.ticket_caisse) AS tickets,
                    (SELECT count(*) FROM referentiel.article) AS articles"

      - name: Mesures
        run: |
          source deploy/.env
          python3 deploy/volume/mesurer.py --url http://localhost:8080 --mot-de-passe "$ADMIN_MOT_DE_PASSE" \
            --repetitions ${{ inputs.repetitions }} --sortie mesures.md
          {
            echo "## Mesures à l'échelle ${{ inputs.echelle }}"
            echo
            cat mesures.md
          } >> "$GITHUB_STEP_SUMMARY"
          # Le jeu généré est cohérent : le contrôle des soldes ne trouve aucun écart.
          grep -q "0 écart(s)" mesures.md

      - name: Tableau des mesures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesures-echelle-${{ inputs.echelle }}
          path: mesures.md
          if-no-files-found: ignore

      - name: Journaux de l'API
        if: always()
        run: $COMPOSE logs --tail 200 api

      - name: Arrêt
        if: always()
        run: $COMPOSE down -v
