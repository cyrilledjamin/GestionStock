<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GestionStock</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="icone.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icone-192.png" />
    <meta name="theme-color" content="#1f5f4a" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div class="chargement">GestionStock…</div>
    </div>
    <div id="blazor-error-ui">
        Une erreur est survenue / An error occurred.
        <a href="" class="reload">Recharger / Reload</a>
    </div>
    <script src="js/outils.js"></script>
    <script src="js/stockage-local.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // Culture de démarrage = langue gardée sur le poste : Blazor ne charge que les données de culture utiles.
        Blazor.start({ applicationCulture: localStorage.getItem('gestionstock.langue') === 'en' ? 'en-GB' : 'fr-CM' });
    </script>
    <script>navigator.serviceWorker && navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>
</html>
